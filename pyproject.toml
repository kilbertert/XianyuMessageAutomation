[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "xianyu-message-automation"
version = "0.4.0"
description = "Safe, stateful Android automation for receiving and replying to messages in Xianyu."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "uiautomator2>=3.7,<4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]

[project.scripts]
xianyu-msg = "xianyu_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["src"]
testpaths = ["tests"]
